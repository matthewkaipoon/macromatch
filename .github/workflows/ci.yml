name: MacroMatch CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-rebuild:
    name: Python 3.13 tests and offline USDA rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      USDA_API_KEY: ''
    steps:
      - name: Check out committed source and frozen raw data
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run all M01–M16 regression tests
        run: python -m pytest -q

      - name: Rebuild twice from frozen M04 snapshot and verify read-only services
        run: python scripts/m16_verify.py --report data/temp/m16-ci-report.json

      - name: Upload verification report (no DuckDB files or secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macromatch-m16-verification
          path: data/temp/m16-ci-report.json
          if-no-files-found: ignore
          retention-days: 14
